name: Site GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Tirages le mardi et le vendredi soir : mise à jour le lendemain matin (heure UTC).
    - cron: "17 6 * * 3,6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Échoue si une archive FDJ manque : le site déjà en ligne reste alors inchangé.
      - name: Télécharger l'historique FDJ et générer les données du site
        run: python3 euromillions.py --export-json site/data/tirages.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
